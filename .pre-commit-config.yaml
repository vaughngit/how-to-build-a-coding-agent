# Pre-commit guards against secret/config spillage.
#
#   pip install pre-commit       # or: brew install pre-commit
#   pre-commit install           # enable the hooks in this clone
#   pre-commit run --all-files   # run them on demand
#   pre-commit autoupdate        # bump the pinned versions below
#
# Note: local hooks can be skipped with `git commit --no-verify`, so the
# non-bypassable enforcement lives in CI (.github/workflows/secret-scan.yml).
repos:
  # Secret scanning — the load-bearing guard. Detects credentials anywhere in
  # the diff, not just in one filename.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Belt-and-suspenders: hard-block the local Bedrock config so it can never be
  # committed even if .gitignore is bypassed with `git add -f`.
  - repo: local
    hooks:
      - id: forbid-bedrock-json
        name: forbid committing bedrock.json
        entry: "bedrock.json must stay local — copy bedrock.json.example instead"
        language: fail
        files: '^bedrock\.json$'

  # Stock hygiene hooks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
